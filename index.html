<script>
const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];
const TM=["7:55-8:40","8:40-9:25","9:25-10:10","10:40-11:25","11:25-12:10","12:35-1:15","1:15-1:55"];
// كل يوم: "حصة:صف" مفصولة بمسافة
const parseD=s=>s.split(" ").filter(Boolean).map(x=>{const[p,...c]=x.split(":");return{p:+p,c:c.join(":")}});

const DEF={id:"chem",dept:"الكيمياء",school:"ثانوية الإمام مالك",meet:{day:2,p:[4,5],text:"اجتماع القسم والتوطين"},raw:[
{n:"محمد فوزي",d:["1:11ع/6 4:12ع/5","5:12ع/7 7:12ع/5","2:11ع/6 6:12ع/5","1:12ع/7 3:11ع/6","2:12ع/7"]},
{n:"أيمن محمود",d:["2:12ع/3 6:12ع/1","2:12ع/3","3:12ع/3","2:12ع/1","3:12ع/1"]},
{n:"بهاء المهدي",d:["1:11ع/4","5:11ع/1 6:12ع/6","3:11ع/1 6:12ع/6","2:11ع/1 7:11ع/4","1:11ع/4 3:12ع/6"]},
{n:"أحمد جمال",d:["1:12ع/4 6:11ع/8","4:12ع/4 7:11ع/3","2:11ع/8 3:11ع/3","1:12ع/4","2:11ع/3 4:11ع/8"]},
{n:"ناصر الهرشاني",d:["6:10/5","4:12ع/2 6:10/1","3:10/5 6:10/1","4:10/1 7:12ع/2","2:10/5 3:12ع/2"]},
{n:"أحمد السيد",d:["2:11ع/2 4:10/7 6:11ع/5","1:11ع/2 2:10/2","1:10/2 6:11ع/5","2:11ع/2 3:10/7","2:10/7 5:11ع/5 7:10/2"]},
{n:"سليمان المقداد",d:["5:10/4 7:10/8","1:10/6 2:10/4","1:10/8 6:10/10","3:10/6 4:10/10 6:10/4","2:10/10 3:10/6 6:10/8"]},
{n:"محمد حفني",d:["1:10/9 6:10/3","5:10/3 7:11ع/7","2:11ع/7 3:10/9","1:10/9","4:11ع/7 6:10/3"]}
]};
let SETS=[DEF],CUR=0,T=[],DEPT="",SCHOOL="",MEET=null,SMP=null,SMPR=false,CAPS=null,DB=null;
const validSet=x=>x&&typeof x.id=="string"&&typeof x.dept=="string"&&Array.isArray(x.raw)&&x.raw.every(t=>t&&typeof t.n=="string"&&Array.isArray(t.d)&&t.d.length==5&&t.d.every(v=>typeof v=="string"));
function applySaved(a){
 if(!Array.isArray(a))return false;
 SETS=[DEF];
 a.forEach(x=>{if(!validSet(x))return;const k=SETS.findIndex(y=>y.id==x.id);if(k>=0)SETS[k]=x;else SETS.push(x)});
 return true;
}
function useSet(i){CUR=SETS[i]?i:0;const x=SETS[CUR];T=mk(x.raw);DEPT=x.dept;SCHOOL=x.school||DEF.school;MEET=x.meet||null}
try{applySaved(JSON.parse(localStorage.getItem("sets")||"null"));const id=localStorage.getItem("CUR"),k=SETS.findIndex(y=>y.id==id);CUR=k>=0?k:0}catch(e){}
useSet(CUR);
const gr=c=>{const m=String(c).match(/\d+/),g=m?+m[0]:0;return g>=10&&g<=12?"g"+g:"g0"};
const sunFrac=()=>{const P=[1,2,3,4,5,6,7],fl=DAYS.flatMap((_,i)=>P.map(p=>free(i,p))),u=90.5/(fl.length-fl.filter(Boolean).length+.7*fl.filter(Boolean).length);return (9.5+fl.slice(0,7).reduce((a,f)=>a+(f?u*.7:u),0))/100};
const free=(i,p)=>T.every(u=>!u.d[i].some(l=>l.p==p));
const cell=c=>`<span class="c ${gr(c)}">${c}</span>`;
const classes=[...new Set(T.flatMap(t=>t.d.flat().map(x=>x.c)))].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b,"ar",{numeric:true}));
const $=id=>document.getElementById(id);
const tt=x=>x.split("-").join("<br>");
const hd=(first)=>`<tr><th class="nm">${first}</th>`+[0,1,2].map(i=>`<th>${i+1}<small>${tt(TM[i])}</small></th>`).join("")+`<th class="br"><span class="vt">الفرصة</span></th>`+[3,4].map(i=>`<th>${i+1}<small>${tt(TM[i])}</small></th>`).join("")+`<th class="br"><span class="vt">فرصة<br>الصلاة</span></th>`+[5,6].map(i=>`<th>${i+1}<small>${tt(TM[i])}</small></th>`).join("")+`</tr>`;
function cols(items,rs,ri){ // items: [{p,c}]
  let h="";
  for(let p=1;p<=7;p++){
    if(p==4||p==6)h+=`<td class="br"></td>`;

  }
  return h;
}
let tab="t",ti=0,di=(()=>{const g=new Date().getDay();return g<5?g:0})(),ci=classes[0];
function aggInner(){
    const P=[1,2,3,4,5,6,7];
    return `<div class="sc"><table class="mx">${(()=>{const fl=DAYS.flatMap((_,i)=>P.map(p=>free(i,p))),nF=fl.filter(Boolean).length,u=90.5/(fl.length-nF+.7*nF);return `<colgroup><col style="width:9.5%">${fl.map(f=>`<col style="width:${(f?u*.7:u).toFixed(3)}%">`).join("")}</colgroup>`})()}<tr><th rowspan="2" class="nm">المعلم</th>${DAYS.map(d=>`<th colspan="7" class="d1" style="background:var(--g10)">${d}</th>`).join("")}</tr><tr>${DAYS.map(()=>P.map(p=>`<th class="${p==1?"d1":""}">${p}</th>`).join("")).join("")}</tr>${T.map((t,k)=>`<tr><td class="nm">${t.n}</td>${DAYS.map((_,i)=>P.map(p=>{const x=t.d[i].find(l=>l.p==p),fr=free(i,p);if(isMt(i,p))return p==MEET.p[0]?(k==0?`<td colspan="${MEET.p.length}" rowspan="${T.length}" class="fr mt"><span class="vv">${esc(MEET.text)}</span></td>`:""):"";return `<td class="${p==1?"d1 ":""}${x?"mc "+gr(x.c):fr?"fr":""}">${x?x.c:""}</td>`}).join("")).join("")}</tr>`).join("")}</table></div>`;
}
const isMt=(i,p)=>!!MEET&&i==MEET.day&&MEET.p.includes(p)&&MEET.p.every(q=>free(i,q));
function render(){
  if(tab!=LT){LT=tab;ZM=(tab=="a"||tab=="u"||tab=="w")?Math.max(.25,Math.min(1,($("view").clientWidth-22)/(1350*sunFrac()))):1;if(tab=="u"||tab=="w")X=newX()}
  if(tab=="m"&&!ME)tab="t";
  $("who").innerHTML=whoHtml();
  $("h1").textContent="جدول معلمي "+DEPT;$("sch").textContent=SCHOOL;document.title="جدول معلمي "+DEPT+" – "+SCHOOL;
  $("dsw").innerHTML=SETS.length>1?`<select onchange="switchSet(+this.value)">${SETS.map((x,i)=>`<option value="${i}" ${i==CUR?"selected":""}>${esc(x.dept)}</option>`).join("")}</select>`:"";
  $("tabs").innerHTML=[...(ME?[["m","جدولي","👤"]]:[]),["t","باقي المعلمين","👥"],["d","جدول اليوم","📅"],["a","الجدول المجمع","🗂️"],["p","مواعيد الحصص","⏰"],...(ADM?[["u","تغيير","✏️"],["w","جديد","➕"]]:[])].map(([k,l,i])=>`<button class="tile ${tab==k?"on":""}" onclick="tab='${k}';render()"><span class="ic">${i}</span><span>${l}</span></button>`).join("");
  let h="";
  if(tab=="t"||tab=="m"){
    const t=tab=="m"?T.find(x=>x.n==ME):T[ti],all=t.d.flat(),u=[...new Set(all.map(x=>x.c))];ttl="جدول أ/ "+t.n;
    h=`<div class="chips${tab=="t"?" tc":""}">${tab=="m"?"":T.map((x,i)=>`<button class="${i==ti?"on":""}" onclick="ti=${i};render()">${x.n}</button>`).join("")}</div>
    <div class="card tm" id="cap">${bar()}<b>${t.n}</b> · <span class="mu">${all.length} حصة أسبوعيًا</span>
    <div class="sc"><table>${hd("اليوم")}${DAYS.map((d,i)=>`<tr><td class="nm">${d}</td>${cols(t.d[i],5,i)}</tr>`).join("")}</table></div>

    <div class="card tm dy" id="cap">${bar()}<b>جدول يوم ${DAYS[di]} لكل المعلمين</b>
    <div class="sc"><table>${hd("المعلم")}${T.map((t,k)=>`<tr><td class="nm">${t.n}</td>${cols(t.d[di],T.length,k)}</tr>`).join("")}</table></div>
    <div class="sum mu">${T.filter(t=>!t.d[di].length).map(t=>t.n).join("، ")?"بدون حصص: "+T.filter(t=>!t.d[di].length).map(t=>t.n).join("، "):""}</div></div>`;

    const SC=[["الحصة 1",475,520],["الحصة 2",520,565],["الحصة 3",565,610],["الفرصة الأولى",610,640,1],["الحصة 4",640,685],["الحصة 5",685,730],["فرصة الصلاة",730,755,1],["الحصة 6",755,795],["الحصة 7",795,835]];

 return `<div class="card" id="cap"><b>${w?"قسم جديد (نموذج منفصل)":"تغيير جداول "+esc(DEPT)}</b>
 <div class="mu" style="font-size:12px;margin:4px 0 8px">${w?"ارفع صور جداول معلمي القسم الجديد، وهيتعمل لهم نفس التصميم في نموذج منفصل من غير ما الأصلي يتغير.":"ارفع صور الجداول الجديدة وهيتحدّث نفس الجدول بنفس التنسيق."}</div>
 ${w?`<div class="fm"><input type="text" id="xd" placeholder="اسم القسم (مثال: الفيزياء)"><input type="text" id="xs" placeholder="اسم المدرسة" value="${esc(SCHOOL)}"></div>`:""}
 <input type="file" id="xf" accept="image/*" multiple onchange="xFiles(this)">
 <div class="mu" id="xn" style="margin:6px 0;font-size:12px"></div>
 <div class="exp" style="justify-content:flex-start"><button class="on" id="xb" onclick="xRun()">استخراج الجداول</button><button id="xc" style="display:none" onclick="xStop()">إيقاف</button></div>
 <div class="mu" id="xt" style="margin-top:4px;font-size:13px"></div><div class="xr" id="xr"></div>
 ${w?"":`<div style="margin-top:12px;border-top:1px solid var(--bd);padding-top:8px"><button id="xg" onclick="xDanger()">${SETS[CUR].id=="chem"?"استرجاع الجدول الأصلي":"حذف هذا النموذج"}</button></div>`}</div>`;
}
function xInit(){
 if(SMPR&&!SMP)xt("الميزة دي مش متاحة في العرض الحالي، افتح الصفحة من Claude");
 else if(SMPR&&CAPS&&!CAPS.images)xt("رفع الصور مش متاح في العرض الحالي");
}
function xFiles(el){
 const mx=CAPS&&CAPS.images?CAPS.images.maxCount:8;let f=[...el.files];
 X.files=f.slice(0,mx);X.cand=null;const r=$("xr");if(r)r.innerHTML="";
 $("xn").textContent=f.length?(X.files.length+" صورة"+(f.length>mx?" (الحد الأقصى "+mx+" صور)":"")):"";
}
function xStop(){try{X.ctl&&X.ctl.abort()}catch(e){}}
function normRaw(o){
 const L=o&&Array.isArray(o.teachers)?o.teachers:Array.isArray(o)?o:[],out=[];
 for(const t of L){
  const n=String(t&&t.n||"").replace(/^\s*(أ\s*[\/.]|الأستاذ|الاستاذ)\s*/,"").trim();if(!n)continue;
  const dd=Array.isArray(t.d)?t.d:[];
  const d=[0,1,2,3,4].map(i=>{const seen=new Set(),it=[];String(dd[i]||"").split(/\s+/).forEach(x=>{const m=x.match(/^([1-7]):(.+)$/);if(m&&!seen.has(x)){seen.add(x);it.push({p:+m[1],c:m[2]})}});it.sort((a,b)=>a.p-b.p);return it.map(x=>x.p+":"+x.c).join(" ")});
  const ex=out.find(x=>x.n==n);
  if(ex)ex.d=ex.d.map((v,i)=>[...new Set((v+" "+d[i]).split(/\s+/).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b)).join(" "));else out.push({n,d});
 }
 return out;
}
const XP=`أنت بتقرأ صور جداول حصص مدرسية لمعلمي قسم واحد، وعايز لكل معلم حصصه الأسبوعية.
القواعد:
- الصور ممكن تكون أجزاء من نفس الجدول، فادمجها ومتكررش المعلم.
- أيام الأسبوع بالترتيب: الأحد، الإثنين، الثلاثاء، الأربعاء، الخميس (5 عناصر بالظبط لكل معلم).
- الحصص مرقمة من 1 إلى 7.
- كل حصة تتكتب بالشكل "رقم_الحصة:اسم_الفصل" وبين الحصص مسافة، واسم الفصل يتنقل زي ما هو مكتوب في الصورة بالظبط من غير مسافات جواه (مثال: 11ع/6 أو 10/5 أو 12ع/3).
- لو اليوم مفيهوش حصص للمعلم اكتب نص فاضي "".
- اسم المعلم زي ما هو مكتوب من غير ألقاب مثل أ/.
- ما تخترعش بيانات، ولو حاجة مش واضحة سيبها.
رجّع JSON فقط، بدون أي كلام تاني، بالشكل ده:
{"teachers":[{"n":"اسم المعلم","d":["1:11ع/6 4:12ع/5","5:12ع/7","","1:12ع/7 3:11ع/6","2:12ع/7"]}]}`;
function aggFor(raw,meet){const sv=[T,MEET];T=mk(raw);MEET=meet;try{return aggInner()}finally{T=sv[0];MEET=sv[1]}}
async function xRun(){
 if(X.busy)return;
 if(!SMP){xt(SMPR?"الميزة دي مش متاحة في العرض الحالي، افتح الصفحة من Claude":"لحظة، لسه بجهّز الميزة... جرّب تاني بعد ثواني");return}
 if(CAPS&&!CAPS.images){xt("رفع الصور مش متاح في العرض الحالي");return}
 if(!X.files.length){xt("اختار صور الجداول الأول");return}
 const w=tab=="w",dept=w?$("xd").value.trim():DEPT,school=w?($("xs").value.trim()||SCHOOL):SCHOOL;
 if(w&&!dept){xt("اكتب اسم القسم الأول");return}
 X.busy=true;X.cand=null;$("xr").innerHTML="";$("xb").disabled=true;$("xc").style.display="";
 xt("Claude بيقرأ الصور... ممكن ياخد دقيقة أو أكتر");
 X.ctl=new AbortController();
 try{
  const out=await SMP.json(XP,{images:X.files,signal:X.ctl.signal,modelTier:"complex",cache:false});
  const raw=normRaw(out),n=raw.length,c=raw.reduce((a,t)=>a+t.d.reduce((b,v)=>b+(v?v.split(" ").length:0),0),0);
  if(!n||!c){xt("ما لقيتش جداول واضحة في الصور، جرّب صور أوضح");return}
  X.cand={raw,dept,school,w};
  xt("اتقرا "+n+" معلم و "+c+" حصة. راجع الأسماء والحصص قبل الاعتماد.");
  $("xr").innerHTML=aggFor(raw,w?null:MEET)+`<div class="exp" style="justify-content:center;margin-top:8px"><button class="on" onclick="xOk()">✓ اعتماد</button><button onclick="xCancel()">✕ إلغاء</button></div>`;
  applyZ();
 }catch(e){
  if(e&&e.code!="cancelled")xt(EM[e&&e.code]||"حصلت مشكلة، جرّب تاني");else xt("");
 }finally{
  X.busy=false;const b=$("xb"),k=$("xc");if(b)b.disabled=false;if(k)k.style.display="none";
 }
}
function xCancel(){X.cand=null;$("xr").innerHTML="";xt("")}
async function saveSets(){
 const L=SETS.filter(x=>x.id!="chem"||JSON.stringify(x.raw)!=JSON.stringify(DEF.raw)||x.dept!=DEF.dept||x.school!=DEF.school),j=JSON.stringify(L);
 let loc=false,sh=false;
 try{localStorage.setItem("sets",j);loc=true}catch(e){}
 if(DB){try{await DB.doc("app/sets").set({json:j});sh=true}catch(e){}}
 return sh?"اتحفظ للكل ✓":loc?"اتحفظ على جهازك بس":"تعذر الحفظ";
}
function switchSet(i,tb){
 useSet(i);try{localStorage.setItem("CUR",SETS[CUR].id)}catch(e){}
 ME=meGet();ti=0;if(tb)tab=tb;if(ME&&tb)tab="m";LT=null;render();
}
async function xOk(){
 const c=X.cand;if(!c)return;
 if(c.w){const id="s"+Date.now().toString(36);SETS.push({id,dept:c.dept,school:c.school,meet:null,raw:c.raw});CUR=SETS.length-1}
 else SETS[CUR]={...SETS[CUR],raw:c.raw};
 const r=await saveSets();switchSet(CUR,"a");msg(r);
}
async function xDanger(){
 if(!DG){DG=1;$("xg").textContent="اضغط تاني للتأكيد";return}
 DG=0;
 if(SETS[CUR].id=="chem")SETS[0]=DEF;else SETS.splice(CUR,1);
 const r=await saveSets();switchSet(0,"t");msg(r);
}
try{claude.use("user").then(async u=>{if(u&&await u.canEdit()){ADM=true;render()}}).catch(()=>{})}catch(e){}
try{claude.use("sample").then(async x=>{SMP=x;SMPR=true;if(x){CAPS=await x.limits().catch(()=>null)}if(tab=="u"||tab=="w")xInit()}).catch(()=>{SMPR=true})}catch(e){SMPR=true}
try{claude.use("db").then(async d=>{if(!d)return;DB=d;const r=await d.doc("app/sets").get();if(r.exists){const j=JSON.parse(r.data().json||"[]"),id=SETS[CUR].id;applySaved(j);const k=SETS.findIndex(y=>y.id==id);useSet(k>=0?k:0);ME=meGet();render()}}).catch(()=>{})}catch(e){}
try{claude.use("downloads").then(d=>{if(d){DL=d;render()}}).catch(()=>{})}catch(e){}
render();
</script>
